# Company Brain system settings. Committed to git with the engine.
#
# Two channels (System/Sharing models.md):
#   - git carries the system only: engine, skills, templates, System/ docs, settings like this file.
#   - content (Company/, Teams/) reaches teammates through a Google Shared Drive or shared folder,
#     never git. Personal/ never leaves this machine.
# So nothing about the company lives here. Company settings are in Company/company.yaml (they travel
# with the content); this machine's sharing setup is in brain.local.yaml (gitignored).
# This file is also the marker hooks and the CLI use to find the brain root.

brain:
  name: Company Brain
  version: 0.1.0

git:
  # Paths git may carry besides the built-in system paths (.company-brain/, System/, Templates/,
  # .claude/, .claude-plugin/, .github/, .obsidian/ and the root docs). Content paths can never be
  # added. Example: allow: [docs, CONTRIBUTING.md]
  allow: []
